<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRP司令室</title>

<style>
body{
  margin:0;
  background:#050505;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  padding:18px;
}
.card{
  background:#111;
  border:1px solid #7A5A00;
  border-radius:18px;
  padding:16px;
  margin:12px 0;
}
.gold{color:#F4D06F;}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.big{
  font-size:34px;
  font-weight:700;
}
.bar{
  height:8px;
  background:#222;
  border-radius:99px;
  overflow:hidden;
  margin-top:12px;
}
.fill{
  height:100%;
  background:linear-gradient(90deg,#8B6A00,#F4D06F);
  transition:width .5s;
}
.levels{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.level{
  border:1px solid #555;
  border-radius:12px;
  padding:10px;
  text-align:center;
}
.active{
  border:2px solid #F4D06F;
  background:#1a1608;
}
.small{
  color:#aaa;
  font-size:13px;
}
.news{
  border-top:1px solid #333;
  padding:12px 0;
}
.news:first-child{
  border-top:0;
}
.news a{
  color:white;
  text-decoration:none;
  font-weight:600;
  line-height:1.45;
}
.news-meta{
  color:#888;
  font-size:11px;
  margin-top:5px;
}
.tag{
  display:inline-block;
  font-size:10px;
  padding:3px 6px;
  border-radius:6px;
  margin-right:5px;
  background:#332800;
  color:#F4D06F;
}
.alert{
  padding:10px;
  border-radius:10px;
  background:#1a1608;
  border:1px solid #7A5A00;
  margin-top:10px;
}
.status{
  margin-top:8px;
  font-size:11px;
  color:#777;
}
</style>
</head>

<body>

<h1 class="gold">⚡ XRP司令室</h1>
<div class="small">BLACK × GOLD TERMINAL</div>

<div class="grid">

<div class="card">
<div class="small">XRP / JPY</div>
<div id="x" class="big">取得中...</div>
<div id="xchange" class="small">--</div>
</div>

<div class="card">
<div class="small">BTC / USD</div>
<div id="b" class="big">取得中...</div>
<div id="bchange" class="small">--</div>
</div>

</div>

<div class="card">

<div class="small">10,000 XRP 評価額</div>
<div id="v" class="big gold">--</div>

<div id="r"></div>

<div class="bar">
<div id="fill" class="fill" style="width:0%"></div>
</div>

<div id="progress" class="small"></div>

</div>

<div class="card">

<h3 class="gold">🎯 戦闘価格帯</h3>

<div class="levels">
<div id="l225" class="level">225円</div>
<div id="l250" class="level">250円</div>
<div id="l275" class="level">275円</div>
<div id="l300" class="level">300円</div>
<div id="l400" class="level">400円</div>
<div id="l500" class="level">500円</div>
</div>

<div id="zone" class="alert">
価格帯を確認中...
</div>

</div>

<div class="card">

<h3 class="gold">🚨 最重要監視</h3>

<div>🛡️ <b>225円防衛</b></div>
<div>🏛️ <b>CLARITY Act</b></div>
<div>📈 <b>XRP現物ETF</b></div>
<div>🏦 <b>FRB / FOMC</b></div>
<div>₿ <b>BTC急変</b></div>

</div>

<div class="card">

<h3 class="gold">📰 最新ニュース</h3>

<div class="small">
CLARITY / ETF / SEC / Ripple / FOMCを優先表示
</div>

<div id="news">
ニュース取得中...
</div>

</div>

<div id="status" class="status">
価格接続を開始しています...
</div>

<script>

const TARGET = 2750000;
const HOLD = 10000;

let lastXRP = null;
let lastBTC = null;


/* =========================
   タイムアウト付きfetch
========================= */

async function fetchJSON(url, timeout=8000){

  const controller = new AbortController();

  const timer = setTimeout(
    () => controller.abort(),
    timeout
  );

  try{

    const response = await fetch(
      url,
      {
        signal:controller.signal,
        cache:"no-store"
      }
    );

    if(!response.ok){
      throw new Error("HTTP "+response.status);
    }

    return await response.json();

  }finally{

    clearTimeout(timer);

  }

}


/* =========================
   XRP価格
   Bitbank → CoinGecko
========================= */

async function getXRP(){

  try{

    const d = await fetchJSON(
      "https://public.bitbank.cc/xrp_jpy/ticker"
    );

    if(d && d.data && d.data.last){

      return Number(d.data.last);

    }

  }catch(e){

    console.log("Bitbank XRP error",e);

  }


  try{

    const d = await fetchJSON(
      "https://api.coingecko.com/api/v3/simple/price?ids=ripple&vs_currencies=jpy"
    );

    if(d && d.ripple && d.ripple.jpy){

      return Number(d.ripple.jpy);

    }

  }catch(e){

    console.log("CoinGecko XRP error",e);

  }

  return null;

}


/* =========================
   BTC価格
   Kraken → CoinGecko
========================= */

async function getBTC(){

  try{

    const d = await fetchJSON(
      "https://api.kraken.com/0/public/Ticker?pair=XBTUSD"
    );

    if(
      d &&
      d.result &&
      d.result.XXBTZUSD &&
      d.result.XXBTZUSD.c
    ){

      return Number(d.result.XXBTZUSD.c[0]);

    }

  }catch(e){

    console.log("Kraken BTC error",e);

  }


  try{

    const d = await fetchJSON(
      "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd"
    );

    if(d && d.bitcoin && d.bitcoin.usd){

      return Number(d.bitcoin.usd);

    }

  }catch(e){

    console.log("CoinGecko BTC error",e);

  }

  return null;

}


/* =========================
   価格更新
========================= */

async function load(){

  try{

    const results = await Promise.all([
      getXRP(),
      getBTC()
    ]);

    const x = results[0];
    const b = results[1];


    /* XRP */

    if(x !== null){

      document.getElementById("x").textContent =
        x.toFixed(1)+"円";


      if(lastXRP !== null){

        const diff = x-lastXRP;

        document.getElementById("xchange").textContent =
          diff > 0
          ? "↑ 前回取得比 +"+diff.toFixed(1)+"円"
          : diff < 0
          ? "↓ 前回取得比 "+diff.toFixed(1)+"円"
          : "→ 変化なし";

      }else{

        document.getElementById("xchange").textContent =
          "リアルタイム取得";

      }


      lastXRP=x;


      /* 評価額 */

      const value=Math.round(x*HOLD);
      const remain=TARGET-value;

      document.getElementById("v").textContent =
        value.toLocaleString()+"円";


      document.getElementById("r").textContent =
        remain>0
        ? "275万円まで あと"+remain.toLocaleString()+"円"
        : "🎯 目標達成";


      let percent=(value/TARGET)*100;

      percent=Math.max(
        0,
        Math.min(100,percent)
      );


      document.getElementById("fill").style.width =
        percent+"%";


      document.getElementById("progress").textContent =
        "目標進捗 "+percent.toFixed(1)+"%";


      updateZone(x);

    }


    /* BTC */

    if(b !== null){

      document.getElementById("b").textContent =
        "$"+Math.round(b).toLocaleString();


      if(lastBTC !== null){

        const diff=b-lastBTC;

        document.getElementById("bchange").textContent =
          diff > 0
          ? "↑ 前回取得比 +$"+Math.round(diff).toLocaleString()
          : diff < 0
          ? "↓ 前回取得比 -$"+Math.round(Math.abs(diff)).toLocaleString()
          : "→ 変化なし";

      }else{

        document.getElementById("bchange").textContent =
          "リアルタイム取得";

      }


      lastBTC=b;

    }


    const now=new Date();

    document.getElementById("status").textContent =
      "🟢 価格接続OK ｜ 最終取得 "+
      now.toLocaleTimeString("ja-JP");

  }catch(e){

    console.log("価格更新エラー",e);

    document.getElementById("status").textContent =
      "🟡 一時的な取得エラー ｜ 次回再試行";

  }

}


/* =========================
   価格帯判定
========================= */

function updateZone(x){

  document.querySelectorAll(".level")
  .forEach(el=>el.classList.remove("active"));


  if(x<225){

    document.getElementById("l225")
    .classList.add("active");

    document.getElementById("zone").textContent =
      "🔴 警戒：225円を下回っています";

  }else if(x<250){

    document.getElementById("l225")
    .classList.add("active");

    document.getElementById("zone").textContent =
      "🟡 防衛圏：225〜250円";

  }else if(x<275){

    document.getElementById("l250")
    .classList.add("active");

    document.getElementById("zone").textContent =
      "🟢 上昇圏：250〜275円";

  }else if(x<300){

    document.getElementById("l275")
    .classList.add("active");

    document.getElementById("zone").textContent =
      "🚀 目標圏：275〜300円";

  }else if(x<400){

    document.getElementById("l300")
    .classList.add("active");

    document.getElementById("zone").textContent =
      "🚀 強気圏：300〜400円";

  }else if(x<500){

    document.getElementById("l400")
    .classList.add("active");

    document.getElementById("zone").textContent =
      "🔥 爆発圏：400〜500円";

  }else{

    document.getElementById("l500")
    .classList.add("active");

    document.getElementById("zone").textContent =
      "👑 500円突破圏";

  }

}


/* =========================
   ニュース
========================= */

async function loadNews(){

  const newsBox=document.getElementById("news");

  const feeds=[

    {
      tag:"🔴 緊急",
      name:"CLARITY Act",
      query:"CLARITY Act XRP Ripple crypto"
    },

    {
      tag:"🔴 緊急",
      name:"SEC / Ripple",
      query:"SEC Ripple XRP"
    },

    {
      tag:"🟠 重要",
      name:"XRP ETF",
      query:"XRP ETF"
    },

    {
      tag:"🟡 注目",
      name:"FRB / FOMC",
      query:"FRB FOMC crypto"
    },

    {
      tag:"🟡 注目",
      name:"BTC",
      query:"Bitcoin crypto market"
    }

  ];


  let all=[];


  for(const feed of feeds){

    try{

      const rss=
        "https://news.google.com/rss/search?q="+
        encodeURIComponent(feed.query)+
        "&hl=ja&gl=JP&ceid=JP:ja";


      const url=
        "https://api.rss2json.com/v1/api.json?rss_url="+
        encodeURIComponent(rss);


      const data=await fetchJSON(url,10000);


      if(data.items){

        data.items.slice(0,3).forEach(item=>{

          all.push({

            title:item.title,
            link:item.link,
            date:new Date(item.pubDate),
            tag:feed.tag,
            name:feed.name

          });

        });

      }

    }catch(e){

      console.log(
        "ニュース取得エラー",
        feed.name,
        e
      );

    }

  }


  all.sort(
    (a,b)=>b.date-a.date
  );


  all=all.slice(0,10);


  if(all.length===0){

    newsBox.innerHTML=
      '<div class="small">'+
      '📰 ニュースを取得できませんでした。'+
      '</div>';

    return;

  }


  newsBox.innerHTML=all.map(item=>{

    return `
      <div class="news">

        <div>
          <span class="tag">${item.tag}</span>
          <span class="small">${item.name}</span>
        </div>

        <div style="margin-top:6px;">
          <a href="${item.link}" target="_blank">
            ${escapeHTML(translateTitle(item.title))}
          </a>
        </div>

        <div class="news-meta">
          ${formatTime(item.date)}
        </div>

      </div>
    `;

  }).join("");

}


/* =========================
   日本語用タイトル整理
========================= */

function translateTitle(title){

  return String(title)

    .replace(/CLARITY Act/gi,"CLARITY法案")
    .replace(/Ripple/gi,"Ripple")
    .replace(/XRP ETF/gi,"XRP ETF")
    .replace(/spot ETF/gi,"現物ETF")
    .replace(/Federal Reserve/gi,"米連邦準備制度")
    .replace(/Bitcoin/gi,"ビットコイン")
    .replace(/crypto/gi,"暗号資産")
    .replace(/cryptocurrency/gi,"暗号資産")
    .replace(/Fed/gi,"FRB")
    .replace(/SEC/gi,"SEC");

}


/* =========================
   時刻表示
========================= */

function formatTime(date){

  const now=new Date();

  const diff=Math.floor(
    (now-date)/1000
  );


  if(diff<60){
    return "たった今";
  }

  if(diff<3600){
    return Math.floor(diff/60)+"分前";
  }

  if(diff<86400){
    return Math.floor(diff/3600)+"時間前";
  }

  return date.toLocaleString("ja-JP");

}


/* =========================
   HTML安全化
========================= */

function escapeHTML(str){

  return String(str)

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   起動
========================= */

load();
loadNews();

/* XRP/BTC 5秒ごと */
setInterval(load,5000);

/* ニュース5分ごと */
setInterval(loadNews,300000);

</script>

</body>
</html>
