<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>⚡ XRP司令室 PRO</title>

<style>
:root{
--gold:#D4AF37;
--gold2:#F7D774;
--bg:#000;
--card:#080808;
--line:#3a2d00;
--red:#ff2d2d;
--yellow:#ffcc00;
--green:#00ff80;
--gray:#9ca3af;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:linear-gradient(180deg,#000,#080808);
color:white;
padding:18px;
max-width:700px;
margin:auto;
}
.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}
h1{
font-size:34px;
color:var(--gold);
}
.sub{color:#777;font-size:13px}
.card{
background:var(--card);
border:1px solid var(--line);
border-radius:20px;
padding:16px;
margin-bottom:14px;
box-shadow:0 0 18px rgba(212,175,55,.06);
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}
.label{font-size:13px;color:var(--gray)}
.big{font-size:42px;font-weight:700}
.defcon{
padding:14px;
border-radius:16px;
text-align:center;
font-weight:700;
font-size:24px;
margin-bottom:16px;
transition:.3s;
}
.green{background:#002814;border:1px solid var(--green)}
.yellow{background:#332800;border:1px solid var(--yellow)}
.red{background:#2b0000;border:1px solid var(--red);animation:pulse 1s infinite}
.critical{background:#500000;border:2px solid var(--red);animation:pulse .45s infinite}
@keyframes pulse{
50%{box-shadow:0 0 22px red;}
}
.progress{
height:12px;
background:#222;
border-radius:20px;
overflow:hidden;
margin:10px 0;
}
.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,var(--gold),var(--gold2));
transition:.4s;
}
.row{
display:flex;
justify-content:space-between;
align-items:center;
}
.levels{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:12px;
}
.level{
padding:12px;
border-radius:12px;
text-align:center;
background:#111;
border:1px solid #333;
}
.level.active{
border-color:var(--gold);
box-shadow:0 0 12px rgba(212,175,55,.35);
}
.news{
display:flex;
align-items:center;
gap:8px;
padding:10px 0;
border-top:1px solid #222;
}
.badge{
background:#222;
padding:4px 8px;
border-radius:999px;
font-size:11px;
color:var(--gold);
}
.scan{
margin-top:12px;
padding:12px;
border-radius:12px;
background:#050505;
border:1px dashed var(--gold);
text-align:center;
cursor:pointer;
user-select:none;
}
.scanText{
margin-top:8px;
font-size:12px;
color:#777;
}
.footer{
margin-top:20px;
text-align:center;
color:#666;
font-size:12px;
}
</style>
</head>
<body>

<div class="header">
<div>
<h1>⚡ XRP司令室</h1>
<div class="sub">BLACK × GOLD TERMINAL</div>
</div>
<div id="time" class="sub"></div>
</div>

<div id="defcon" class="defcon red">DEFCON RED</div>

<div class="grid">

<div class="card">
<div class="label">XRP / JPY</div>
<div id="xrp" class="big">--</div>
<div id="xrp24" class="sub">--</div>
</div>

<div class="card">
<div class="label">BTC / USD</div>
<div id="btc" class="big">$--</div>
<div id="btc24" class="sub">--</div>
</div>

</div>

<div class="card">
<div class="label">💰 10,000 XRP評価額</div>
<div id="asset" class="big" style="color:var(--gold)">--</div>

<div class="row" style="margin-top:8px">
<div class="label">275万円まで</div>
<div id="remain" style="color:var(--gold);font-weight:700">--</div>
</div>

<div class="progress">
<div id="fill" class="fill"></div>
</div>

<div class="row">
<div class="label">達成率</div>
<div id="rate">0%</div>
</div>
</div>

<div class="card">

<div class="row">
<div class="label">🎯 防衛ライン</div>
<div id="alert" style="color:var(--red);font-weight:700">監視中</div>
</div>

<div class="levels">
<div id="l205" class="level">205</div>
<div id="l225" class="level">225</div>
<div id="l250" class="level">250</div>
<div class="level">275</div>
<div class="level">300</div>
<div class="level">500</div>
</div>

</div>

<div class="card">

<div class="row">
<div class="label">🌎 NY市場</div>
<div id="market">判定中...</div>
</div>

<div class="row" style="margin-top:10px">
<div class="label">次回更新</div>
<div id="next">10秒</div>
</div>

</div>

<div class="card">

<div class="row">
<div class="label">📢 XRP速報</div>
<div class="badge">LIVE</div>
</div>

<div class="news">
🚀 CLARITY Act
</div>

<div class="news">
📈 XRP ETF監視
</div>

<div class="news">
⚡ BTC急変監視
</div>

<div id="scanBtn" class="scan">
🛰 司令官モード
<div class="scanText">タップで市場スキャン</div>
</div>

</div>

<div class="footer">
XRP司令室 PRO
</div>

<script>

const HOLD=10000;
const TARGET=2750000;

async function update(){

try{

const r=await fetch("https://api.coingecko.com/api/v3/simple/price?ids=ripple,bitcoin&vs_currencies=jpy,usd&include_24hr_change=true");

const d=await r.json();

const xrp=d.ripple.jpy;
const btc=d.bitcoin.usd;

document.getElementById("xrp").textContent=xrp.toFixed(1)+"円";
document.getElementById("btc").textContent="$"+Math.round(btc).toLocaleString();

document.getElementById("xrp24").textContent=
(d.ripple.jpy_24h_change>=0?"+":"")+d.ripple.jpy_24h_change.toFixed(2)+"%";

document.getElementById("btc24").textContent=
(d.bitcoin.usd_24h_change>=0?"+":"")+d.bitcoin.usd_24h_change.toFixed(2)+"%";

const asset=xrp*HOLD;
const remain=Math.max(0,TARGET-asset);
const rate=Math.min(asset/TARGET*100,100);

document.getElementById("asset").textContent=Math.round(asset).toLocaleString()+"円";
document.getElementById("remain").textContent=Math.round(remain).toLocaleString()+"円";
document.getElementById("rate").textContent=rate.toFixed(1)+"%";
document.getElementById("fill").style.width=rate+"%";

const def=document.getElementById("defcon");
const alert=document.getElementById("alert");

document.getElementById("l205").classList.remove("active");
document.getElementById("l225").classList.remove("active");
document.getElementById("l250").classList.remove("active");

if(xrp>=250){
def.className="defcon green";
def.textContent="🚀 DEFCON GREEN";
alert.textContent="250円突破";
document.getElementById("l250").classList.add("active");
}
else if(xrp>=225){
def.className="defcon green";
def.textContent="🟢 DEFCON GREEN";
alert.textContent="225円防衛";
document.getElementById("l225").classList.add("active");
}
else if(xrp>=220){
def.className="defcon yellow";
def.textContent="🟡 DEFCON YELLOW";
alert.textContent="警戒域";
document.getElementById("l225").classList.add("active");
}
else if(xrp>=205){
def.className="defcon red";
def.textContent="🔴 DEFCON RED";
alert.textContent="220円割れ";
document.getElementById("l205").classList.add("active");
}
else{
def.className="defcon critical";
def.textContent="☠️ DEFCON CRITICAL";
alert.textContent="205円割れ";
document.getElementById("l205").classList.add("active");
}

}catch(e){
console.log(e);
}

clock();

}

function clock(){

const now=new Date();

document.getElementById("time").textContent=
now.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});

const h=now.getHours();

document.getElementById("market").innerHTML=
(h>=22||h<5)?
"<span style='color:#00ff80'>OPEN</span>":
"<span style='color:#999'>CLOSED</span>";

}

update();

let c=10;

setInterval(()=>{
c--;
if(c<=0){
c=10;
update();
}
document.getElementById("next").textContent=c+"秒";
},1000);

document.getElementById("scanBtn").onclick=()=>{

const btn=document.getElementById("scanBtn");

btn.innerHTML="📡 SCANNING MARKET...";

setTimeout(()=>{
btn.innerHTML="✅ 市場危険度：警戒<br><div class='scanText'>Fear & Greed・出来高・BTC連動確認完了</div>";
},2000);

};

if("serviceWorker" in navigator){

const sw=`
self.addEventListener('install',e=>self.skipWaiting());
self.addEventListener('fetch',()=>{});
`;

navigator.serviceWorker.register(
URL.createObjectURL(new Blob([sw],{type:"text/javascript"}))
);

}

</script>

</body>
</html>
