<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>XRP COMMAND CENTER</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050505;color:#eee;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 padding:14px
}
h1{color:#d8b45a;font-size:24px;margin:4px 0}
h2{font-size:17px;color:#d8b45a;margin:0 0 10px}
.sub{color:#888;font-size:12px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{
 background:#101010;border:1px solid #292929;
 border-radius:12px;padding:14px;margin-bottom:10px
}
.price{font-size:27px;font-weight:700}
.xrp{color:#d8b45a}
.btc{color:#aaa}
.small{font-size:12px;color:#888}
.up{color:#5fd18b}.down{color:#ff6868}
.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:8px 5px;border-bottom:1px solid #222}
td:last-child{text-align:right}
.news a{
 display:block;color:#ddd;text-decoration:none;
 padding:10px 0;border-bottom:1px solid #222;
 font-size:13px;line-height:1.4
}
.news a:hover{color:#d8b45a}
.badge{
 display:inline-block;padding:5px 8px;border-radius:6px;
 background:#1a1a1a;color:#d8b45a;font-size:11px;margin:3px
}
button{
 width:100%;padding:11px;border:1px solid #444;
 background:#151515;color:#ddd;border-radius:8px
}
</style>
</head>

<body>

<h1>⚡ XRP COMMAND CENTER</h1>
<div class="sub">LIVE MARKET / REGULATION / NEWS</div>

<div class="grid">

<div class="card">
<h2>XRP / JPY</h2>
<div id="xrp" class="price xrp">取得中…</div>
<div id="xrpchg" class="small">---</div>
</div>

<div class="card">
<h2>BTC / JPY</h2>
<div id="btc" class="price btc">取得中…</div>
<div id="btcchg" class="small">---</div>
</div>

<div class="card full">
<h2>💰 10,000 XRP</h2>
<div id="asset" class="price">---</div>
<div id="target" class="small">2,750,000円まで ---</div>
</div>

<div class="card full">
<h2>🎯 XRP PRICE ZONE</h2>
<table>
<tr><td>225円</td><td id="p225">---</td></tr>
<tr><td>250円</td><td id="p250">---</td></tr>
<tr><td>275円</td><td id="p275">---</td></tr>
<tr><td>300円</td><td id="p300">---</td></tr>
<tr><td>400円</td><td id="p400">---</td></tr>
<tr><td>500円</td><td id="p500">---</td></tr>
</table>
</div>

<div class="card full">
<h2>🚨 IMPORTANT</h2>
<span class="badge">CLARITY ACT</span>
<span class="badge">XRP SPOT ETF</span>
<span class="badge">FOMC / FRB</span>
<span class="badge">REGULATION</span>
</div>

<div class="card full">
<h2>📰 XRP NEWS</h2>
<div id="news" class="news">ニュース取得中…</div>
</div>

<div class="card full">
<button onclick="location.reload()">🔄 手動更新</button>
</div>

</div>

<script>

const XRP_API =
"https://public.bitbank.cc/xrp_jpy/ticker";

const BTC_API =
"https://public.bitbank.cc/btc_jpy/ticker";

function yen(n){
 return Number(n).toLocaleString("ja-JP",{
   maximumFractionDigits:2
 })+" 円";
}

async function getPrice(){

 try{
   const xr=await fetch(XRP_API+"?t="+Date.now());
   const xd=await xr.json();

   const x=Number(xd.data.last);

   document.getElementById("xrp").textContent=yen(x);

   document.getElementById("asset").textContent=yen(x*10000);

   const diff=2750000-x*10000;

   document.getElementById("target").textContent=
     diff>0
     ?"2,750,000円まで "+yen(diff)
     :"🎉 2,750,000円突破！";

   const levels=[225,250,275,300,400,500];

   levels.forEach(v=>{
     const el=document.getElementById("p"+v);
     const d=x-v;

     if(d>=0){
       el.textContent="＋"+yen(d);
       el.className="up";
     }else{
       el.textContent="−"+yen(Math.abs(d));
       el.className="down";
     }
   });

 }catch(e){
   document.getElementById("xrp").textContent="取得失敗";
   console.log("XRP ERROR",e);
 }

 try{
   const br=await fetch(BTC_API+"?t="+Date.now());
   const bd=await br.json();

   const b=Number(bd.data.last);

   document.getElementById("btc").textContent=yen(b);

 }catch(e){
   document.getElementById("btc").textContent="取得失敗";
   console.log("BTC ERROR",e);
 }

}

async function getNews(){

 const q=encodeURIComponent(
   "XRP OR Ripple OR CLARITY Act OR XRP ETF"
 );

 const url=
   "https://news.google.com/rss/search?q="+
   q+
   "&hl=ja&gl=JP&ceid=JP:ja";

 try{

   const r=await fetch(
     "https://api.rss2json.com/v1/api.json?rss_url="+
     encodeURIComponent(url)
   );

   const d=await r.json();

   if(!d.items || !d.items.length)
     throw new Error("NO NEWS");

   let html="";

   d.items.slice(0,10).forEach(item=>{

     const title=item.title || "XRP NEWS";

     html+=
       '<a href="'+item.link+
       '" target="_blank" rel="noopener">'+
       title+
       "</a>";

   });

   document.getElementById("news").innerHTML=html;

 }catch(e){

   document.getElementById("news").innerHTML=
     '<a href="https://news.google.com/search?q=XRP" target="_blank">📰 XRPニュースをGoogle Newsで開く</a>'+
     '<a href="https://news.google.com/search?q=Ripple%20CLARITY%20Act" target="_blank">⚖️ CLARITY Actニュース</a>'+
     '<a href="https://news.google.com/search?q=XRP%20ETF" target="_blank">🏦 XRP ETFニュース</a>';

   console.log("NEWS ERROR",e);
 }

}

getPrice();
getNews();

setInterval(getPrice,30000);
setInterval(getNews,300000);

</script>

</body>
</html>
