<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XRP司令室</title>
<style>
body{
  margin:0;
  background:#050505;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
header{
  padding:20px;
  text-align:center;
  color:#ffd700;
  font-size:28px;
  font-weight:bold;
}
.box{
  margin:12px;
  padding:18px;
  border:1px solid #444;
  border-radius:12px;
  background:#111;
}
.label{color:#888;font-size:12px}
.value{font-size:30px;color:#ffd700;font-weight:bold;margin-top:5px}
.row{display:flex;gap:10px}
.row .box{flex:1;margin:5px}
</style>
</head>

<body>

<header>⚡ XRP司令室</header>

<div class="row">

<div class="box">
<div class="label">XRP / JPY</div>
<div class="value" id="xrp">読み込み中</div>
</div>

<div class="box">
<div class="label">BTC / USD</div>
<div class="value" id="btc">読み込み中</div>
</div>

</div>

<div class="box">
<div class="label">10,000 XRP 評価額</div>
<div class="value" id="total">---</div>
</div>

<div class="box">
<div class="label">🎯 275万円まで</div>
<div class="value" id="target">---</div>
</div>

<div class="box">
<div class="label">📍 重要価格帯</div>
225円　250円　275円　300円　400円　500円
</div>

<div class="box">
<div class="label">🚨 最重要材料</div>
<br>
<b>LEVEL 1</b>　CLARITY Act<br><br>
<b>LEVEL 2</b>　XRP Spot ETF<br><br>
<b>LEVEL 3</b>　FRB / FOMC
</div>

<div class="box">
<div class="label">📰 NEWS</div>
<br>
<a href="https://www.google.com/search?q=XRP+Ripple+news"
style="color:#ffd700">
XRP最新ニュースを開く →
</a>
</div>

<div class="box">
<div class="label">SYSTEM</div>
<div id="status">画面起動中</div>
</div>

<script>

async function update(){

try{

const url=
"https://api.coingecko.com/api/v3/simple/price"+
"?ids=ripple,bitcoin&vs_currencies=jpy,usd";

const response=await fetch(url);
const data=await response.json();

const xrp=data.ripple.jpy;
const btc=data.bitcoin.usd;

document.getElementById("xrp").innerText=
"¥"+xrp.toLocaleString();

document.getElementById("btc").innerText=
"$"+btc.toLocaleString();

const total=xrp*10000;

document.getElementById("total").innerText=
"¥"+Math.round(total).toLocaleString();

const diff=2750000-total;

document.getElementById("target").innerText=
diff>0
?"あと ¥"+Math.round(diff).toLocaleString()
:"🎯 目標突破！";

document.getElementById("status").innerText=
"🟢 LIVE　最終更新 "+
new Date().toLocaleTimeString();

}catch(error){

document.getElementById("status").innerText=
"🔴 価格取得エラー";

}

}

update();

setInterval(update,60000);

</script>

</body>
</html>
