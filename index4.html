<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>XRP司令室</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%,#17345c 0%,#080d18 38%,#03050a 80%);
  color:#eaf6ff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
}

.wrap{
  max-width:700px;
  margin:auto;
  padding:14px;
}

.header{
  border:1px solid rgba(0,220,255,.35);
  background:rgba(5,12,23,.88);
  border-radius:20px;
  padding:18px;
  box-shadow:
    0 0 25px rgba(0,190,255,.12),
    inset 0 0 25px rgba(0,150,255,.05);
}

.title{
  font-size:25px;
  font-weight:900;
  letter-spacing:2px;
}

.sub{
  margin-top:5px;
  font-size:11px;
  color:#79a8bd;
  letter-spacing:1px;
}

.status{
  margin-top:14px;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:#72dfff;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ff3b55;
  box-shadow:0 0 10px #ff3b55;
}

.dot.on{
  background:#20ff9a;
  box-shadow:0 0 12px #20ff9a;
}

.pricebox{
  margin-top:14px;
  padding:24px 18px;
  border-radius:22px;
  border:1px solid rgba(0,240,255,.4);
  background:
    linear-gradient(145deg,rgba(0,170,255,.10),rgba(5,8,18,.92));
  box-shadow:
    0 0 30px rgba(0,200,255,.13),
    inset 0 0 30px rgba(0,200,255,.04);
}

.label{
  font-size:12px;
  color:#6fa6bb;
  letter-spacing:2px;
}

.price{
  margin-top:5px;
  font-size:52px;
  line-height:1;
  font-weight:900;
  letter-spacing:-2px;
  color:#7deaff;
  text-shadow:0 0 18px rgba(0,220,255,.45);
}

.unit{
  font-size:17px;
  color:#75a7b9;
  margin-left:5px;
}

.update{
  margin-top:10px;
  font-size:11px;
  color:#64899b;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.card{
  border:1px solid rgba(100,180,220,.2);
  background:rgba(7,13,24,.86);
  border-radius:16px;
  padding:15px;
}

.card .name{
  font-size:11px;
  color:#7294a6;
  margin-bottom:7px;
}

.card .value{
  font-size:21px;
  font-weight:800;
}

.green{color:#39ffad;}
.red{color:#ff6178;}
.blue{color:#75e8ff;}
.yellow{color:#ffd66b;}

.section{
  margin-top:14px;
}

.section-title{
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  color:#91d8ed;
  margin-bottom:8px;
}

.level{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(100,180,220,.17);
  background:#080e18;
  border-radius:13px;
  padding:12px 14px;
  margin-bottom:7px;
}

.level.active{
  border-color:#36eaff;
  box-shadow:0 0 18px rgba(0,220,255,.18);
}

.levelrow{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.levelprice{
  font-size:18px;
  font-weight:900;
}

.levelname{
  font-size:11px;
  color:#708b99;
}

.bar{
  height:4px;
  background:#172330;
  border-radius:5px;
  margin-top:9px;
  overflow:hidden;
}

.barin{
  height:100%;
  width:0%;
  background:#28dfff;
  box-shadow:0 0 8px #28dfff;
  transition:.5s;
}

.target{
  margin-top:12px;
  padding:18px;
  border-radius:18px;
  border:1px solid rgba(255,205,90,.3);
  background:rgba(255,190,50,.055);
}

.targettitle{
  font-size:12px;
  color:#b89b57;
}

.targetvalue{
  margin-top:5px;
  font-size:28px;
  font-weight:900;
  color:#ffd86a;
}

.footer{
  text-align:center;
  padding:20px 0 10px;
  font-size:10px;
  color:#486474;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">
    <div class="title">⚡ XRP司令室</div>
    <div class="sub">COMMAND CENTER / REALTIME MARKET SYSTEM</div>

    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="status">Bitbank 接続待機中…</span>
    </div>
  </div>

  <div class="pricebox">

    <div class="label">XRP / JPY　REALTIME</div>

    <div>
      <span id="xrpPrice" class="price">---</span>
      <span class="unit">円</span>
    </div>

    <div id="update" class="update">
      データ待機中…
    </div>

  </div>

  <div class="grid">

    <div class="card">
      <div class="name">24時間出来高</div>
      <div id="volume" class="value blue">---</div>
    </div>

    <div class="card">
      <div class="name">10,000 XRP 評価額</div>
      <div id="value10000" class="value green">---</div>
    </div>

    <div class="card">
      <div class="name">24時間高値</div>
      <div id="high" class="value">---</div>
    </div>

    <div class="card">
      <div class="name">24時間安値</div>
      <div id="low" class="value">---</div>
    </div>

  </div>

  <div class="target">
    <div class="targettitle">🎯 司令目標 / 2,750,000円</div>
    <div id="distance" class="targetvalue">---</div>
  </div>

  <div class="section">

    <div class="section-title">📡 XRP 戦況メーター</div>

    <div id="levels"></div>

  </div>

  <div class="footer">
    DATA SOURCE : BITBANK REALTIME STREAM
  </div>

</div>


<script>

/* =========================
   XRP司令室 REALTIME CORE
   Bitbank WebSocket
========================= */

const WS_URL =
  "wss://stream.bitbank.cc/socket.io/?EIO=4&transport=websocket";

let ws = null;
let reconnectTimer = null;

const priceEl = document.getElementById("xrpPrice");
const volumeEl = document.getElementById("volume");
const valueEl = document.getElementById("value10000");
const highEl = document.getElementById("high");
const lowEl = document.getElementById("low");
const distanceEl = document.getElementById("distance");
const statusEl = document.getElementById("status");
const dotEl = document.getElementById("dot");
const updateEl = document.getElementById("update");
const levelsEl = document.getElementById("levels");


const levels = [
  {price:225, name:"重要防衛ライン"},
  {price:250, name:"上昇確認ライン"},
  {price:275, name:"🎯 司令目標"},
  {price:300, name:"強気ゾーン"},
  {price:400, name:"爆発ゾーン"},
  {price:500, name:"最終目標ゾーン"}
];


function yen(n){
  return Number(n).toLocaleString("ja-JP",{
    minimumFractionDigits:3,
    maximumFractionDigits:3
  });
}


function integer(n){
  return Number(n).toLocaleString("ja-JP",{
    maximumFractionDigits:0
  });
}


function setStatus(text,on=false){

  statusEl.textContent = text;

  if(on){
    dotEl.classList.add("on");
  }else{
    dotEl.classList.remove("on");
  }

}


function renderLevels(price){

  levelsEl.innerHTML = "";

  let activeIndex = -1;

  for(let i=0;i<levels.length;i++){

    if(price >= levels[i].price){
      activeIndex = i;
    }

  }

  levels.forEach((item,i)=>{

    const div = document.createElement("div");

    div.className =
      "level " +
      (i === activeIndex ? "active" : "");

    let percent =
      Math.max(
        0,
        Math.min(
          100,
          (price / item.price) * 100
        )
      );

    div.innerHTML = `
      <div class="levelrow">
        <div>
          <div class="levelprice">
            ${item.price.toFixed(3)} 円
          </div>
          <div class="levelname">
            ${item.name}
          </div>
        </div>

        <div class="levelname">
          ${price >= item.price ? "突破" : "未到達"}
        </div>
      </div>

      <div class="bar">
        <div class="barin"
             style="width:${percent}%"></div>
      </div>
    `;

    levelsEl.appendChild(div);

  });

}


function updatePrice(data){

  const price = Number(data.last);

  if(!price || !isFinite(price)){
    return;
  }

  priceEl.textContent = yen(price);

  volumeEl.textContent =
    integer(data.vol) + " XRP";

  valueEl.textContent =
    integer(price * 10000) + " 円";

  highEl.textContent =
    yen(data.high) + " 円";

  lowEl.textContent =
    yen(data.low) + " 円";


  const target = 2750000;

  const currentValue = price * 10000;

  const diff = target - currentValue;


  if(diff > 0){

    distanceEl.textContent =
      "あと " + integer(diff) + " 円";

    distanceEl.className =
      "targetvalue yellow";

  }else{

    distanceEl.textContent =
      "🎉 目標突破 +" +
      integer(Math.abs(diff)) +
      " 円";

    distanceEl.className =
      "targetvalue green";

  }


  renderLevels(price);


  updateEl.textContent =
    "最終更新 " +
    new Date().toLocaleTimeString("ja-JP");

}


function connect(){

  try{

    setStatus(
      "Bitbank リアルタイム接続中…",
      false
    );

    ws = new WebSocket(WS_URL);


    ws.onopen = function(){

      setStatus(
        "● Bitbank REALTIME 接続中",
        true
      );

      /*
        Socket.IO / Engine.IO

        40 = Socket.IO接続開始
      */

      ws.send("40");

      setTimeout(()=>{

        if(ws.readyState === WebSocket.OPEN){

          ws.send(
            '42["join-room","ticker_xrp_jpy"]'
          );

        }

      },300);

    };


    ws.onmessage = function(event){

      const msg = event.data;

      /*
        Engine.IO ping
      */

      if(msg === "2"){

        ws.send("3");
        return;

      }


      /*
        ticker message
      */

      if(
        msg.startsWith(
          '42["message"'
        )
      ){

        try{

          const json =
            JSON.parse(msg.substring(2));

          const payload =
            json[1];

          if(
            payload &&
            payload.message &&
            payload.message.data
          ){

            updatePrice(
              payload.message.data
            );

          }

        }catch(e){

          console.log(
            "解析エラー",
            e
          );

        }

      }

    };


    ws.onerror = function(){

      setStatus(
        "接続エラー → 再接続します",
        false
      );

    };


    ws.onclose = function(){

      setStatus(
        "接続切断 → 再接続待機中…",
        false
      );

      clearTimeout(reconnectTimer);

      reconnectTimer =
        setTimeout(
          connect,
          3000
        );

    };


  }catch(e){

    setStatus(
      "接続開始エラー",
      false
    );

    clearTimeout(reconnectTimer);

    reconnectTimer =
      setTimeout(
        connect,
        3000
      );

  }

}


/* 初期表示 */

renderLevels(0);


/* 接続開始 */

connect();

</script>

</body>
</html>
