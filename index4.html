<html lang="ja">
<head>

<style>
:root{
  --bg:#02040a;--panel:#07101d;--line:rgba(0,234,255,.22);
  --cyan:#00eaff;--blue:#268cff;--purple:#9b5cff;
  --pink:#ff3dbd;--green:#00f5a0;--red:#ff4d6d;

}
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;background:
  radial-gradient(circle at 10% 0%,rgba(0,234,255,.14),transparent 28%),

.header,.card{

.header{

.mission-header{display:flex;justify-content:space-between;gap:15px}
.mission-name{font-size:20px;font-weight:950;color:var(--gold)}
.mission-target{color:#8e9eac;font-size:11px;margin-top:4px}
.mission-current{text-align:right}

.portfolio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.asset{
  border:1px solid rgba(0,234,255,.12);border-radius:15px;padding:15px;

}
.asset:nth-child(2){border-color:rgba(155,92,255,.2)}
.asset:nth-child(3){border-color:rgba(255,61,189,.2)}
.asset-top{display:flex;justify-content:space-between;margin-bottom:12px}
.asset-name{font-weight:900;letter-spacing:.08em}
.asset-tag{font-size:9px;color:#6f879a}
.asset-price{font-size:28px;font-weight:950}
.asset-yen{font-size:11px;color:var(--cyan)}
.asset-info{margin-top:11px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.info-box{background:rgba(0,0,0,.22);border-radius:9px;padding:8px}

.total-box{

}
.total-main-label,.total-small-label{color:#7e99ad;font-size:10px}
.total-main{font-size:31px;font-weight:950}
.total-small{font-size:18px;font-weight:900;margin-top:3px}
.macro-price{font-size:27px;font-weight:900;margin:5px 0}
.macro-sub{font-size:10px;color:var(--muted)}
.macro-row{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.target-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.target{text-align:center;padding:12px 7px;border-radius:13px;border:1px solid rgba(0,234,255,.1);background:rgba(255,255,255,.02)}
.target-price{font-size:17px;font-weight:900}
.target-label{font-size:9px;color:#70869a;margin-top:4px}

.target.next .target-price{color:var(--gold)}
.alert-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

canvas{width:100%;height:100%;display:block}

<!-- ここから先はお前が貼ったレイアウトそのまま -->
<!-- PORTFOLIO / BTC / USDJPY / TARGET / ALERT / CHART / ORDERBOOK / VOLUME / FEAR&GREED -->

<div class="footer">
XRP司令室 ORBIT｜XRP 9,000｜HBAR 7,500｜ONDO 1,540｜5秒更新
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>

<script>

const PORTFOLIO={
  XRP:{amount:9000,avg:183,cost:1647000},
  HBAR:{amount:7500,avg:14.8,cost:111000},
  ONDO:{amount:1540,avg:87.4,cost:134596}
};

const TOTAL_COST=1892596;
const MISSION_GOAL=3000000;

let xrpPrice=null;
let xrpPrevPrice=null;
let btcJpy=null;
let btcUsd=null;
let usdJpy=null;

let hbarUsd=null;
let ondoUsd=null;
let hbarPrice=null;
let ondoPrice=null;

let volumeXrp=0;
let ws=null;
let reconnectTimer=null;
let chartData=[];
let firstXrp=true;
let updateRunning=false;

let fxConnection=null;
let fxRestTimer=null;

function N(v,d=2){
  return Number.isFinite(Number(v))
    ? Number(v).toLocaleString("ja-JP",{
        minimumFractionDigits:d,
        maximumFractionDigits:d
      })
    :"---";
}

function Y(v,d=0){
  return Number.isFinite(Number(v))
    ? Number(v).toLocaleString("ja-JP",{
        minimumFractionDigits:d,
        maximumFractionDigits:d
      })+"円"
    :"---";
}

function setText(id,v){
  const e=document.getElementById(id);
  if(e)e.textContent=v;
}

function setPnl(id,v){
  const e=document.getElementById(id);
  if(!e||!Number.isFinite(v))return;
  e.textContent=(v>=0?"+":"")+Y(v);
  e.classList.toggle("positive",v>0);
  e.classList.toggle("negative",v<0);
}

function setPct(id,v){
  const e=document.getElementById(id);
  if(!e||!Number.isFinite(v))return;
  e.textContent=(v>=0?"+":"")+v.toFixed(2)+"%";
  e.classList.toggle("positive",v>0);
  e.classList.toggle("negative",v<0);
}

async function getJSON(url,timeout=4000){

  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);

  try{
    const r=await fetch(url,{
      cache:"no-store",
      signal:controller.signal,
      headers:{Accept:"application/json"}
    });
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  }finally{
    clearTimeout(timer);
  }
}

/* ===================== USDJPY ===================== */

function applyUSDJPY(price,source="LIVE"){

  const p=Number(price);

  if(!Number.isFinite(p)||p<50||p>250)return;

  usdJpy=p;

  setText("usdJpy",p.toFixed(3));
  setText("fxUpdated","● "+source+" "+new Date().toLocaleTimeString("ja-JP"));

  updateAltJPY();

  if(Number.isFinite(btcJpy)){
    btcUsd=btcJpy/usdJpy;
    updateMacro();
  }
}

async function fetchUSDJPY(){

  try{

    const j=await getJSON(
      "https://biquote.io/api/USDJPY?allowStale=false&_="+Date.now(),
      3000
    );

    const p=Number(j?.mid);

    if(!Number.isFinite(p)) throw new Error();

    applyUSDJPY(p,"REST");

  }catch(e){

    if(Number.isFinite(usdJpy)){
      setText("usdJpy",usdJpy.toFixed(3));
      setText("fxUpdated","前回値保持");
      updateAltJPY();
    }
  }
}

/* ==== PART1ここまで ==== */
  async function connectUSDJPY(){

  try{

    if(typeof signalR==="undefined"){
      fetchUSDJPY();
      scheduleFXFallback();
      return;
    }

    fxConnection=new signalR.HubConnectionBuilder()
      .withUrl("https://biquote.io/hubs/tick")
      .withAutomaticReconnect([0,2000,5000,10000])
      .build();

    fxConnection.on("ReceiveTick",tick=>{
      if(tick&&String(tick.symbol).toUpperCase()==="USDJPY"){
        applyUSDJPY(tick.mid,"LIVE");
      }
    });

    fxConnection.onreconnected(async()=>{
      try{
        await fxConnection.invoke("Subscribe",["USDJPY"]);
      }catch(e){}
    });

    fxConnection.onclose(()=>scheduleFXFallback());

    await fxConnection.start();
    await fxConnection.invoke("Subscribe",["USDJPY"]);

    setText("fxUpdated","● USDJPY LIVE");

  }catch(e){

    fetchUSDJPY();
    scheduleFXFallback();

    setTimeout(connectUSDJPY,10000);
  }
}

function scheduleFXFallback(){

  if(fxRestTimer)return;

  fxRestTimer=setInterval(async()=>{

    if(fxConnection&&fxConnection.state==="Connected")return;

    fetchUSDJPY();

  },5000);
}

/* ================= HBAR / ONDO ================= */

function updateAltJPY(){

  if(Number.isFinite(hbarUsd)&&Number.isFinite(usdJpy)){
    hbarPrice=hbarUsd*usdJpy;
    setText("portHbarPrice",N(hbarPrice,4));
    setText("hbarStatus","● HBAR/USD × USDJPY LIVE");
    document.getElementById("hbarStatus")?.classList.add("ok");
  }

  if(Number.isFinite(ondoUsd)&&Number.isFinite(usdJpy)){
    ondoPrice=ondoUsd*usdJpy;
    setText("portOndoPrice",N(ondoPrice,4));
    setText("ondoStatus","● ONDO/USD × USDJPY LIVE");
    document.getElementById("ondoStatus")?.classList.add("ok");
  }

  updatePortfolio();
}

async function fetchHBAR(){

  try{

    const j=await getJSON(
      "https://api.coinbase.com/v2/prices/HBAR-USD/spot?_="+Date.now(),
      4000
    );

    const p=Number(j?.data?.amount);

    if(!Number.isFinite(p)||p<=0)throw new Error();

    hbarUsd=p;
    updateAltJPY();

  }catch(e){

    if(Number.isFinite(hbarUsd)&&Number.isFinite(usdJpy)){
      updateAltJPY();
      setText("hbarStatus","● HBAR 前回USD × USDJPY");
    }else{
      setText("hbarStatus","HBAR/USD 取得待機");
    }
  }
}

async function fetchONDO(){

  try{

    const j=await getJSON(
      "https://api.coinbase.com/v2/prices/ONDO-USD/spot?_="+Date.now(),
      4000
    );

    const p=Number(j?.data?.amount);

    if(!Number.isFinite(p)||p<=0)throw new Error();

    ondoUsd=p;
    updateAltJPY();

  }catch(e){

    if(Number.isFinite(ondoUsd)&&Number.isFinite(usdJpy)){
      updateAltJPY();
      setText("ondoStatus","● ONDO 前回USD × USDJPY");
    }else{
      setText("ondoStatus","ONDO/USD 取得待機");
    }
  }
}

/* ================= XRP / BTC ================= */

async function fetchBitbank(){

  const results=await Promise.allSettled([

    getJSON("https://public.bitbank.cc/xrp_jpy/ticker?_="+Date.now(),3000),
    getJSON("https://public.bitbank.cc/btc_jpy/ticker?_="+Date.now(),3000)

  ]);

  if(results[0].status==="fulfilled"){

    const p=Number(results[0].value?.data?.last);

    if(Number.isFinite(p)){
      xrpPrevPrice=xrpPrice;
      xrpPrice=p;

      if(!firstXrp)checkAlerts();

      firstXrp=false;

      addChartPoint(p);
    }
  }

  if(results[1].status==="fulfilled"){

    const p=Number(results[1].value?.data?.last);

    if(Number.isFinite(p))btcJpy=p;
  }

  updateXRP();
  updateMacro();
}

async function fetchBTCUSD(){

  try{

    const j=await getJSON(
      "https://api.coinbase.com/v2/prices/BTC-USD/spot?_="+Date.now(),
      3000
    );

    const p=Number(j?.data?.amount);

    if(Number.isFinite(p))btcUsd=p;

    updateMacro();

  }catch(e){

    if(Number.isFinite(btcJpy)&&Number.isFinite(usdJpy)){
      btcUsd=btcJpy/usdJpy;
      updateMacro();
    }
  }
}

/* ================= PORTFOLIO ================= */

function calc(price,a){

  if(!Number.isFinite(price))return null;

  const value=price*a.amount;
  const pnl=value-a.cost;

  return{
    value,
    pnl,
    pct:pnl/a.cost*100
  };
}

function updatePortfolio(){

  const x=calc(xrpPrice,PORTFOLIO.XRP);
  const h=calc(hbarPrice,PORTFOLIO.HBAR);
  const o=calc(ondoPrice,PORTFOLIO.ONDO);

  if(x){
    setText("portXrpPrice",N(xrpPrice,2));
    setText("portXrpValue",Y(x.value));
    setPnl("portXrpPnl",x.pnl);
    setPct("portXrpPnlPct",x.pct);
  }

  if(h){
    setText("portHbarPrice",N(hbarPrice,4));
    setText("portHbarValue",Y(h.value));
    setPnl("portHbarPnl",h.pnl);
    setPct("portHbarPnlPct",h.pct);
  }

  if(o){
    setText("portOndoPrice",N(ondoPrice,4));
    setText("portOndoValue",Y(o.value));
    setPnl("portOndoPnl",o.pnl);
    setPct("portOndoPnlPct",o.pct);
  }

  let total=0;
  if(x)total+=x.value;
  if(h)total+=h.value;
  if(o)total+=o.value;

  if(total>0){

    const pnl=total-TOTAL_COST;

    setText("totalAssets",Y(total));
    setPnl("totalPnl",pnl);
    setText("missionTotalValue",Y(total));

    const pct=Math.min(100,total/MISSION_GOAL*100);

    document.getElementById("missionProgress").style.width=pct+"%";

    setText("missionPercent","進捗 "+pct.toFixed(1)+"%");

    const remain=Math.max(0,MISSION_GOAL-total);

    setText(
      "missionRemaining",
      remain===0
      ?"🎉 MISSION COMPLETE"
      :"あと "+Y(remain)+" で300万円"
    );
  }
}

/* ================= MACRO ================= */

function updateMacro(){

  if(Number.isFinite(btcJpy))setText("btcPrice",Y(btcJpy));

  if(Number.isFinite(btcUsd)){
    setText("btcUsd","$"+btcUsd.toLocaleString("en-US",{maximumFractionDigits:0}));
  }

  if(Number.isFinite(btcJpy)||Number.isFinite(btcUsd)){
    setText("btcUpdated","更新 "+new Date().toLocaleTimeString("ja-JP"));
  }
}

/* ================= XRP ================= */

function updateXRP(){

  if(!Number.isFinite(xrpPrice))return;

  updateTargets();
  updatePortfolio();
}

function updateTargets(){

  document.querySelectorAll(".target").forEach(e=>{

    const t=Number(e.dataset.target);

    e.classList.remove("reached","next");

    if(xrpPrice>=t)e.classList.add("reached");
  });

  const next=[225,250,300,400,500].find(t=>xrpPrice<t);

  if(next){
    document.querySelector('.target[data-target="'+next+'"]')?.classList.add("next");
  }
}

function checkAlerts(){

  if(!Number.isFinite(xrpPrevPrice)||!Number.isFinite(xrpPrice))return;

  [225,250,300].forEach(level=>{

    if(xrpPrevPrice<level&&xrpPrice>=level){

      document.getElementById("alertBox"+level)?.classList.add("hit");

      setText(
        "alertLog",
        "🚨 XRP "+level+"円到達｜現在 "+N(xrpPrice,2)+"円"
      );
    }
  });
}

/* ================= CHART ================= */

function addChartPoint(price){

  if(!Number.isFinite(price))return;

  chartData.push({
    time:Date.now(),
    price
  });

  if(chartData.length>100)chartData.shift();

  drawChart();
}

function drawChart(){

  const c=document.getElementById("xrpChart");

  if(!c||chartData.length<2)return;

  const r=c.getBoundingClientRect();
  const d=window.devicePixelRatio||1;

  c.width=r.width*d;
  c.height=r.height*d;

  const ctx=c.getContext("2d");
  ctx.setTransform(d,0,0,d,0,0);
  ctx.clearRect(0,0,r.width,r.height);

  const prices=chartData.map(x=>x.price);
  const min0=Math.min(...prices);
  const max0=Math.max(...prices);
  const range=max0-min0||1;
  const min=min0-range*.08;
  const max=max0+range*.08;

  ctx.strokeStyle="rgba(255,255,255,.06)";
  for(let i=1;i<5;i++){
    ctx.beginPath();
    ctx.moveTo(0,r.height*i/5);
    ctx.lineTo(r.width,r.height*i/5);
    ctx.stroke();
  }

  ctx.beginPath();

  chartData.forEach((p,i)=>{

    const xx=i/(chartData.length-1)*r.width;
    const yy=r.height-((p.price-min)/(max-min))*(r.height-20)-10;

    if(i===0)ctx.moveTo(xx,yy);
    else ctx.lineTo(xx,yy);
  });

  ctx.strokeStyle="#00eaff";
  ctx.lineWidth=2;
  ctx.shadowColor="#00eaff";
  ctx.shadowBlur=12;
  ctx.stroke();
}
  /* =====================================================
   MASTER
===================================================== */

async function updateAll(){

  if(updateRunning) return;
  updateRunning=true;

  try{

    await Promise.allSettled([
      fetchBitbank(),
      fetchHBAR(),
      fetchONDO(),
      fetchBTCUSD()
    ]);

    updateAltJPY();
    updateXRP();
    updatePortfolio();
    updateMacro();

  }catch(e){

    console.warn("MASTER ERROR",e);

  }finally{

    updateRunning=false;

  }
}

/* =====================================================
   INIT
   ★ 高速起動版
===================================================== */

function init(){

  /* XRP */
  connectBitbank();
  fetchBitbank();

  /* USDJPY */
  fetchUSDJPY();
