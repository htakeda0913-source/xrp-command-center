
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XRP司令室 4.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07101c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{padding:20px;background:linear-gradient(135deg,#102a46,#091522);border-bottom:1px solid #29445c}
h1{margin:0;font-size:25px}
.sub{color:#8da6bb;font-size:11px;margin-top:4px}
.wrap{max-width:760px;margin:auto;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#102033;border:1px solid #29445c;border-radius:15px;padding:14px;margin-bottom:10px}
.label{font-size:11px;color:#8da6bb}
.big{font-size:24px;font-weight:800;margin-top:4px}
.section{font-size:17px;font-weight:800;margin:16px 2px 8px}
input{width:100%;padding:10px;margin-top:5px;border-radius:9px;border:1px solid #34516b;background:#07111d;color:#fff}
button{width:100%;padding:11px;border:0;border-radius:9px;background:#168bc3;color:#fff;font-weight:700;margin-top:8px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #29445c;font-size:12px;text-align:right}
th:first-child,td:first-child{text-align:left}
.badge{padding:4px 8px;border-radius:8px;font-size:11px}
.green{background:#143d31;color:#69e3b3}
.yellow{background:#4a3c16;color:#f4d86b}
.red{background:#552332;color:#ff9aaa}
.alert{background:#0b1827;border-radius:10px;padding:10px;margin-top:10px}
.footer{text-align:center;color:#60788c;font-size:10px;padding:18px}
</style>
</head>
<body>

<header>
<h1>🚀 XRP司令室 4.0</h1>
<div class="sub">REAL-TIME COMMAND CENTER</div>
</header>

<div class="wrap">

<div class="card">
<div class="label">📡 司令室レポート</div>
<div class="big" id="reportTitle">朝レポート</div>
<div style="margin-top:8px;line-height:1.8">
₿ <span id="rBTC">---</span><br>
💠 <span id="rXRP">---</span><br>
💴 <span id="rJPY">---</span>
</div>
<div class="alert" id="reportMsg">データ取得中...</div>
</div>

<div class="grid">

<div class="card">
<div class="label">XRP / JPY</div>
<div class="big" id="xrp">---</div>
<div id="xrpChange">待機中</div>
</div>

<div class="card">
<div class="label">BTC / USD</div>
<div class="big" id="btc">---</div>
<div id="btcChange">待機中</div>
</div>

<div class="card">
<div class="label">USD / JPY</div>
<div class="big" id="usdjpy">---</div>
</div>

<div class="card">
<div class="label">XRP / USD</div>
<div class="big" id="xrpusd">---</div>
</div>

</div>

<div class="section">💰 ポジション</div>

<div class="card">

<div class="label">保有XRP</div>
<input id="amount" type="number" value="10000" step="0.0001">

<div class="label" style="margin-top:10px">目標金額</div>
<input id="goal" type="number" value="2750000">

<button onclick="calc()">再計算</button>

<div class="big" id="value">---</div>
<div id="gap">---</div>

</div>

<div class="section">🎯 XRP価格シミュレーション</div>

<div class="card">
<table>
<thead>
<tr>
<th>価格</th>
<th>評価額</th>
<th>差</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

<div class="section">🚦 重要価格帯</div>

<div class="card">

<table>
<thead>
<tr>
<th>ライン</th>
<th>状態</th>
</tr>
</thead>

<tbody id="zones"></tbody>

</table>

</div>

<div class="section">🧭 相場判定</div>

<div class="card">
<div id="judge" class="alert">判定中...</div>
</div>

<div class="footer">
XRP司令室4.0　5秒更新
</div>

</div>

<script>
let xrp=0;
let prevXrp=0;
let btcUsd=0;
let prevBtc=0;
let usdJpy=0;

const levels=[225,250,275,300,400,500];

function yen(v){
 return Math.round(v).toLocaleString("ja-JP")+"円";
}

function calc(){

 const amount=Number(amountEl.value)||0;
 const goal=Number(goalEl.value)||2750000;
 const value=xrp*amount;

 valueEl.textContent=yen(value);

 const diff=goal-value;

 gapEl.textContent=
 diff>0
 ?"あと "+yen(diff)
 :"🎉 目標達成";

 table.innerHTML="";

 levels.forEach(p=>{

 const v=p*amount;
 const d=goal-v;

 table.innerHTML+=`
 <tr>
 <td>${p}円</td>
 <td>${yen(v)}</td>
 <td>${d>0?"-"+yen(d):"達成"}</td>
 </tr>`;

 });

 updateZones();
}

function updateZones(){

 zones.innerHTML="";

 [225,250,275,300].forEach(p=>{

 let badge;

 if(xrp>=p)
 badge='<span class="badge green">突破</span>';

 else if(xrp>=p-2)
 badge='<span class="badge yellow">接近</span>';

 else
 badge='<span class="badge red">下</span>';

 zones.innerHTML+=`
 <tr>
 <td>${p}円</td>
 <td>${badge}</td>
 </tr>`;
});
}

function updateReport(){

 const h=new Date().getHours();

 reportTitle.textContent=
 h<12?"朝レポート":h<18?"昼レポート":"夜レポート";

 rBTC.textContent="$"+btcUsd.toLocaleString("en-US");
 rXRP.textContent=xrp.toFixed(3)+"円";
 rJPY.textContent=usdJpy.toFixed(2)+"円";

 if(xrp>=225){
 reportMsg.innerHTML="🟢 225円を上回っています";
 }
 else if(xrp>=219){
 reportMsg.innerHTML="🟡 219円付近で攻防中。225円奪還が鍵。";
 }
 else{
 reportMsg.innerHTML="🔴 219円を下回る警戒ゾーン";
 }
}

function updateJudge(){

 const xm=prevXrp?((xrp-prevXrp)/prevXrp)*100:0;
 const bm=prevBtc?((btcUsd-prevBtc)/prevBtc)*100:0;

 if(xm>0.5&&bm>=0)
 judge.innerHTML="🚀 上昇優勢";

 else if(xm<-0.5&&bm<0)
 judge.innerHTML="🔴 下落警戒";

 else
 judge.innerHTML="🟡 様子見";
}

async function getXRP(){

 try{

 const r=await fetch(
 "https://public.bitbank.cc/xrp_jpy/ticker?x="+Date.now(),
 {cache:"no-store"}
 );

 const d=await r.json();

 prevXrp=xrp;
 xrp=Number(d.data.last);

 xrpEl.textContent=xrp.toFixed(3)+"円";

 if(prevXrp){
 const c=((xrp-prevXrp)/prevXrp)*100;
 xrpChange.textContent=(c>=0?"▲ ":"▼ ")+c.toFixed(3)+"%";
 }

 calc();
 updateReport();
 updateJudge();

 }catch(e){}
}

async function getBTC(){

 try{

 const r=await fetch(
 "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd,jpy&x="+Date.now(),
 {cache:"no-store"}
 );

 const d=await r.json();

 prevBtc=btcUsd;

 btcUsd=d.bitcoin.usd;
 usdJpy=d.bitcoin.jpy/d.bitcoin.usd;

 btcEl.textContent="$"+btcUsd.toLocaleString("en-US");
 usdjpyEl.textContent=usdJpy.toFixed(2)+"円";

 if(prevBtc){
 const c=((btcUsd-prevBtc)/prevBtc)*100;
 btcChange.textContent=(c>=0?"▲ ":"▼ ")+c.toFixed(3)+"%";
 }

 xrpusd.textContent="$"+(xrp/usdJpy).toFixed(4);

 updateReport();
 updateJudge();

 }catch(e){}
}

const amountEl=document.getElementById("amount");
const goalEl=document.getElementById("goal");
const valueEl=document.getElementById("value");
const gapEl=document.getElementById("gap");
const table=document.getElementById("table");
const zones=document.getElementById("zones");
const reportTitle=document.getElementById("reportTitle");
const reportMsg=document.getElementById("reportMsg");
const rBTC=document.getElementById("rBTC");
const rXRP=document.getElementById("rXRP");
const rJPY=document.getElementById("rJPY");
const judge=document.getElementById("judge");
const xrpEl=document.getElementById("xrp");
const btcEl=document.getElementById("btc");
const usdjpyEl=document.getElementById("usdjpy");
const xrpChange=document.getElementById("xrpChange");
const btcChange=document.getElementById("btcChange");
const xrpusd=document.getElementById("xrpusd");

amountEl.oninput=calc;
goalEl.oninput=calc;

calc();
getXRP();
getBTC();

setInterval(getXRP,5000);
setInterval(getBTC,5000);
</script>

</body>
</html>
